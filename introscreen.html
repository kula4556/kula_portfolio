<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="introscreenstyle.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      [data-aos="fade-left"] {
        opacity: 0;
        transform: translateX(-30px);
        transition-property: opacity, transform;
      }

      [data-aos="fade-left"].aos-animate {
        opacity: 1;
        transform: translateX(0);
      }

      [data-aos="fade-right"] {
        opacity: 0;
        transform: translateX(30px);
        transition-property: opacity, transform;
      }
      
      [data-aos="fade-right"].aos-animate {
        opacity: 1;
        transform: translateX(0);
      }

      [data-aos="slide-up"] {
        opacity: 0 !important;
        transform: translateY(25px) !important;
        transition-property: opacity, transform !important;
      }

      [data-aos="slide-up"].aos-animate {
        opacity: 1 !important;
        transform: translateY(0)  !important;
      }

      [data-aos="zoom-in-up"] {
        opacity: 0 !important;
        transform: translateY(25px) !important;
        transition-property: opacity, transform !important;
      }

      [data-aos="zoom-in-up"].aos-animate {
        opacity: 1 !important;
        transform: translateY(0)  !important;
      }
    </style>
    <title>kula-portfolio.web</title>
</head>
<body onclick="goToMain()">
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-icons">
          <i class="fa-solid fa-code" data-aos="slide-up" data-aos-delay="0" data-aos-duration="1000"></i>
          <i class="fa-solid fa-user" data-aos="slide-up" data-aos-delay="200" data-aos-duration="1000"></i>
          <i class="fa-solid fa-globe" data-aos="slide-up" data-aos-delay="400" data-aos-duration="1000"></i>
        </div>
        <div class="loading-text">
          <span data-aos="fade-left" data-aos-duration="1200" data-aos-delay="600" style="display: inline-block;">Welcome</span>
          <span data-aos="fade-right" data-aos-duration="1200" data-aos-delay="800" style="display: inline-block;">to my</span>
          <span data-aos="slide-up" data-aos-duration="1200" data-aos-delay="1000" style="display: inline-block;">My Portfolio.</span></div>
        <small class="loading-subtext"><span data-aos="zoom-in-up" data-aos-duration="1200" data-aos-delay="1200">Kula-portfolio.vercel.app</span></small>
      </div>
    </div>

    <iframe src="main.html" id="main-web-frame"></iframe>
</body>
<script src="loading.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    window.addEventListener('load', function() {
    AOS.init({
      duration: 1200,    
      once: false,       
      offset: 120,       
      delay: 0,          
    });
  });
</script>
</html>
